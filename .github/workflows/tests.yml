name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          HEADLESS: "1"
        # --reruns: saucedemo.com is a shared public demo site and GitHub-hosted
        # runners occasionally hit real network flakiness reaching it
        # (ERR_INTERNET_DISCONNECTED, slow navigations). Retrying here in CI
        # only -- not in pytest.ini -- so a real local failure still fails fast.
        run: pytest --reruns 2 --reruns-delay 5

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/
